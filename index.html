!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Graduate Business Kiosk</title>
    
    <!-- 
        CRITICAL SHIM: This script runs before the widget to prevent the 
        "Cannot assign to read only property" error on strict browsers (Chrome/WebView).
    -->
    <script>
        (function() {
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    // Store the original function
                    const originalGUM = navigator.mediaDevices.getUserMedia;
                    // Attempt to make it writable/configurable if it isn't
                    try {
                        Object.defineProperty(navigator.mediaDevices, 'getUserMedia', {
                            writable: true,
                            value: originalGUM
                        });
                    } catch (e) {
                        console.warn("Could not patch getUserMedia:", e);
                    }
                }
            } catch (err) {
                console.warn("Shim error:", err);
            }
        })();
    </script>

    <!-- Official ElevenLabs Widget Script (Restored) -->
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

    <style>
        /* Reset & Core Layout */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #041E42; /* Gonzaga Navy Blue */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden; /* Prevent scrolling on kiosk */
        }

        /* --- LOBBY SCREEN STYLES --- */
        #lobby-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .mascot-image {
            max-width: 80%; /* Adjust size as needed for Neat Frame */
            max-height: 40vh; /* Limit height to leave room for cards */
            margin-bottom: 30px;
            border-radius: 10px; /* Slightly rounded corners for integration */
            box-shadow: 0 15px 40px rgba(0,0,0,0.5); /* Stronger shadow for mascot */
        }

        h1 {
            font-size: 2.2rem; /* Slightly smaller now that mascot is main visual */
            margin-bottom: 30px; /* Less space needed after mascot */
            font-weight: 300;
            color: #d0d0d0; /* Lighter grey for contrast with background */
        }

        .card-container {
            display: flex;
            flex-direction: column; /* Stack vertically for Portrait Mode */
            gap: 25px;
            width: 100%;
            max-width: 450px; /* Slightly wider for the longer text */
        }

        .agent-card {
            /* Gonzaga Royal Blue to Navy Gradient */
            background: linear-gradient(145deg, #002F6C, #041E42);
            /* Lighter "River Blue" border for contrast */
            border: 1px solid #5E8AB4;
            border-radius: 20px;
            padding: 30px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            display: flex; /* Changed to flex to center content, no avatar now */
            flex-direction: column; /* Stack text info vertically */
            align-items: center;
            justify-content: center;
            gap: 10px; /* Gap between title and description */
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .agent-card:active {
            transform: scale(0.98);
            background: #041E42;
        }

        .card-info {
            text-align: center; /* Center text within cards */
        }

        .card-info h2 {
            margin: 0;
            font-size: 1.6rem; /* Slightly larger heading for cards now */
            color: #ffffff;
        }

        .card-info p {
            margin: 0;
            color: #d0d0d0; /* Slightly brighter text for readability on blue */
            font-size: 1rem;
            line-height: 1.4;
        }

        /* --- AGENT SCREEN STYLES --- */
        #agent-screen {
            display: none; /* Hidden by default */
            height: 100%;
            width: 100%;
            position: relative;
            background-color: #041E42; /* Ensure agent screen matches background */
        }

        /* Container for the ElevenLabs widget */
        #widget-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        /* Custom styling for the widget element itself to ensure it fills space */
        elevenlabs-convai {
            width: 100%;
            height: 100%;
        }

        .back-button {
            position: absolute;
            top: 40px;
            left: 30px;
            z-index: 100; /* Above the widget */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
        }
        
        .tap-instruction {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            color: #5E8AB4; /* River Blue */
            font-size: 1.5rem;
            font-weight: 500;
            z-index: 50;
            animation: pulse 2s infinite;
            pointer-events: none; /* Let clicks pass through to widget */
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .timeout-warning {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(200, 16, 46, 0.9); /* Gonzaga Red for warnings */
            padding: 10px 20px;
            border-radius: 10px;
            display: none; /* Hidden by default */
            pointer-events: none;
            color: white;
            font-weight: bold;
            z-index: 100;
        }

    </style>
</head>
<body>

    <!-- SCREEN 1: THE LOBBY -->
    <div id="lobby-screen">
        <!-- Gonzaga Bulldog Mascot -->
        <img src="https://i.imgur.com/your-bulldog-image.png" alt="Gonzaga Bulldog Mascot" class="mascot-image">
        
        <h1>Choose your path:</h1>
        
        <div class="card-container">
            <!-- AGENT 1: PROSPECTIVE -->
            <div class="agent-card" onclick="startAgent('agent_6901ka6nwcscez3a3z98kvg6mxbg')">
                <div class="card-info">
                    <h2>Prospective Student</h2>
                    <p>Information for prospective Graduate Business Students</p>
                </div>
            </div>

            <!-- AGENT 2: CURRENT -->
            <div class="agent-card" onclick="startAgent('agent_6901ka6nwcscez3a3z98kvg6mxbg')">
                <div class="card-info">
                    <h2>Current Student</h2>
                    <p>Information for current Graduate Business Students</p>
                </div>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: THE AGENT INTERFACE -->
    <div id="agent-screen">
        <button class="back-button" onclick="resetLobby()">← End Chat</button>
        
        <!-- New Instruction Text -->
        <div class="tap-instruction">Tap the circle below to speak</div>
        
        <div class="timeout-warning" id="timeout-msg">Closing in 10s...</div>
        
        <div id="widget-container">
            <!-- Widget is injected here via JS -->
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const IDLE_TIMEOUT_SECONDS = 90; 
        
        let idleTimer;
        
        function startAgent(agentId) {
            console.log("Start Agent clicked for ID:", agentId);

            if (agentId.includes('REPLACE_WITH')) {
                alert("Error: Agent ID missing.");
                return;
            }

            // 1. Switch Screens
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('agent-screen').style.display = 'block';

            // 2. Create the Widget Dynamically
            console.log("Injecting widget...");
            const container = document.getElementById('widget-container');
            container.innerHTML = ''; 

            const widget = document.createElement('elevenlabs-convai');
            widget.setAttribute('agent-id', agentId);
            container.appendChild(widget);

            // 3. Start the Idle Timer
            startIdleTimer();
        }

        function resetLobby() {
            console.log("Resetting to Lobby...");
            const container = document.getElementById('widget-container');
            container.innerHTML = ''; 

            document.getElementById('agent-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
            document.getElementById('timeout-msg').style.display = 'none';
            clearTimeout(idleTimer);
        }

        function startIdleTimer() {
            clearTimeout(idleTimer);
            document.getElementById('timeout-msg').style.display = 'none';

            idleTimer = setTimeout(() => {
                resetLobby();
            }, IDLE_TIMEOUT_SECONDS * 1000);
        }

        document.addEventListener('click', () => {
            if(document.getElementById('agent-screen').style.display === 'block') {
                startIdleTimer();
            }
        });

        document.addEventListener('touchstart', () => {
            if(document.getElementById('agent-screen').style.display === 'block') {
                startIdleTimer();
            }
        });

    </script>
</body>
</html>

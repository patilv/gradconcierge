<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Graduate Business Kiosk</title>
    
    <!-- 
        CRITICAL SHIM: Prevents "Cannot assign to read only property" error.
    -->
    <script>
        (function() {
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const originalGUM = navigator.mediaDevices.getUserMedia;
                    try {
                        Object.defineProperty(navigator.mediaDevices, 'getUserMedia', {
                            writable: true,
                            value: originalGUM
                        });
                    } catch (e) {
                        console.warn("Could not patch getUserMedia:", e);
                    }
                }
            } catch (err) {
                console.warn("Shim error:", err);
            }
        })();
    </script>

    <!-- Official ElevenLabs Widget Script -->
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

    <style>
        /* Reset & Core Layout */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #041E42; /* Gonzaga Navy Blue */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden; /* Prevent scrolling on kiosk */
        }

        /* --- LOBBY SCREEN STYLES --- */
        #lobby-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .mascot-image {
            max-width: 80%; 
            max-height: 35vh; /* Reduced slightly to fit cards better */
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 300;
            color: #d0d0d0;
        }

        .card-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 500px; /* Wider to accommodate 2 columns */
        }

        /* --- 2-COLUMN CARD LAYOUT --- */
        .agent-card {
            background: linear-gradient(145deg, #002F6C, #041E42);
            border: 1px solid #5E8AB4;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: row; /* Side-by-side layout */
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            min-height: 120px;
        }

        /* Left Column: Text Info */
        .info-col {
            flex: 1; /* Takes up remaining space */
            text-align: left;
            padding-left: 10px;
        }

        .info-col h2 {
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            color: #ffffff;
        }

        .info-col p {
            margin: 0;
            color: #d0d0d0;
            font-size: 0.95rem;
            line-height: 1.3;
        }

        /* Right Column: The Widget Container */
        .widget-col {
            width: 80px;
            height: 80px;
            flex-shrink: 0; /* Prevents squishing */
            position: relative;
            
            /* CSS TRICK: transform: scale(1) creates a new "containing block".
               This forces fixed-position elements (like the ElevenLabs widget)
               to be positioned relative to THIS div, not the whole screen.
            */
            transform: scale(1); 
            background: rgba(0,0,0,0.2);
            border-radius: 50%; /* Optional: circle background behind widget */
        }

        /* Force the widget to fill the column */
        elevenlabs-convai {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Optional: Add a label under the widget if space permits, 
           or just let the orb speak for itself */
        
    </style>
</head>
<body>

    <!-- MAIN SINGLE SCREEN -->
    <div id="lobby-screen">
        <!-- Gonzaga Bulldog Mascot -->
        <img src="https://i.imgur.com/your-bulldog-image.png" alt="Gonzaga Bulldog Mascot" class="mascot-image">
        
        <h1>How can we help you today?</h1>
        
        <div class="card-container">
            
            <!-- CARD 1: PROSPECTIVE -->
            <div class="agent-card">
                <div class="info-col">
                    <h2>Prospective Student</h2>
                    <p>Admissions, programs, and campus info</p>
                </div>
                <div class="widget-col">
                    <!-- Agent 1 Widget Embedded Here -->
                    <elevenlabs-convai agent-id="agent_6901ka6nwcscez3a3z98kvg6mxbg"></elevenlabs-convai>
                </div>
            </div>

            <!-- CARD 2: CURRENT -->
            <div class="agent-card">
                <div class="info-col">
                    <h2>Current Student</h2>
                    <p>Class schedules, resources, and support</p>
                </div>
                <div class="widget-col">
                     <!-- Agent 2 Widget Embedded Here (Using same ID for test) -->
                    <elevenlabs-convai agent-id="agent_6901ka6nwcscez3a3z98kvg6mxbg"></elevenlabs-convai>
                </div>
            </div>

        </div>
    </div>

    <!-- No JS needed for screen switching anymore! -->

</body>
</html>

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Graduate Business Kiosk</title>
    
    <!-- 
         FIX: Switched back to the stable ElevenLabs hosted script.
         The 'unpkg' version you were using attempts to modify browser security settings 
         (getUserMedia), which causes the "Cannot assign to read only property" error 
         on strict devices like the Neat Frame. This version is safe for kiosks.
    -->
    <script src="https://elevenlabs.io/convai-widget/v1" async type="text/javascript"></script>

    <style>
        /* Reset & Core Layout */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #041E42; /* Gonzaga Navy Blue */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden; /* Prevent scrolling on kiosk */
        }

        /* --- LOBBY SCREEN STYLES --- */
        #lobby-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .mascot-image {
            max-width: 80%; 
            max-height: 40vh;
            margin-bottom: 30px;
            border-radius: 10px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 30px;
            font-weight: 300;
            color: #d0d0d0;
        }

        .card-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 450px;
        }

        .agent-card {
            background: linear-gradient(145deg, #002F6C, #041E42);
            border: 1px solid #5E8AB4;
            border-radius: 20px;
            padding: 30px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .agent-card:active {
            transform: scale(0.98);
            background: #041E42;
        }

        .card-info {
            text-align: center;
        }

        .card-info h2 {
            margin: 0;
            font-size: 1.6rem;
            color: #ffffff;
        }

        .card-info p {
            margin: 0;
            color: #d0d0d0;
            font-size: 1rem;
            line-height: 1.4;
        }

        /* --- AGENT SCREEN STYLES --- */
        #agent-screen {
            display: none; /* Hidden by default */
            height: 100%;
            width: 100%;
            position: relative;
            background-color: #041E42;
        }

        #widget-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        /* Ensure widget is centered */
        elevenlabs-convai {
            /* The widget will render its own size */
        }

        .back-button {
            position: absolute;
            top: 40px;
            left: 30px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
        }
        
        .timeout-warning {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(200, 16, 46, 0.9);
            padding: 10px 20px;
            border-radius: 10px;
            display: none;
            pointer-events: none;
            color: white;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: THE LOBBY -->
    <div id="lobby-screen">
        <!-- Gonzaga Bulldog Mascot -->
        <img src="https://i.imgur.com/your-bulldog-image.png" alt="Gonzaga Bulldog Mascot" class="mascot-image">
        
        <h1>Choose your path:</h1>
        
        <div class="card-container">
            <!-- AGENT 1 -->
            <div class="agent-card" onclick="startAgent('agent_6901ka6nwcscez3a3z98kvg6mxbg')">
                <div class="card-info">
                    <h2>Prospective Student</h2>
                    <p>Information for prospective Graduate Business Students</p>
                </div>
            </div>

            <!-- AGENT 2 (Using same ID for now) -->
            <div class="agent-card" onclick="startAgent('agent_6901ka6nwcscez3a3z98kvg6mxbg')">
                <div class="card-info">
                    <h2>Current Student</h2>
                    <p>Information for current Graduate Business Students</p>
                </div>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: THE AGENT INTERFACE -->
    <div id="agent-screen">
        <button class="back-button" onclick="resetLobby()">← End Chat</button>
        
        <div class="timeout-warning" id="timeout-msg">Closing in 10s...</div>
        
        <div id="widget-container">
            <!-- Widget injected here -->
        </div>
    </div>

    <script>
        // Kiosk Timer (Only runs when NOT in a call)
        const IDLE_TIMEOUT_SECONDS = 90; 
        let idleTimer;
        let isCallActive = false; // Flag to track call state
        
        function startAgent(agentId) {
            console.log("Start Agent clicked for ID:", agentId);

            if (agentId.includes('REPLACE_WITH')) {
                alert("Error: Agent ID missing.");
                return;
            }

            // 1. Switch Screens
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('agent-screen').style.display = 'block';

            // 2. Inject Widget
            const container = document.getElementById('widget-container');
            container.innerHTML = ''; 

            const widget = document.createElement('elevenlabs-convai');
            widget.setAttribute('agent-id', agentId);
            container.appendChild(widget);

            // 3. Attach Event Listeners to handling "Active Call" state
            // Note: These events work with the v1 script as well once the custom element upgrades
            widget.addEventListener('elevenlabs-convai:call:start', () => {
                console.log("Call STARTED. Stopping Idle Timer.");
                isCallActive = true;
                clearTimeout(idleTimer); // Kill the timer immediately
                document.getElementById('timeout-msg').style.display = 'none';
            });

            widget.addEventListener('elevenlabs-convai:call:end', () => {
                console.log("Call ENDED. Resetting Lobby.");
                isCallActive = false;
                // Give a tiny delay so the user sees it ended, then reset
                setTimeout(() => resetLobby(), 2000);
            });

            // 4. Start the initial timer (waiting for user to tap the circle)
            isCallActive = false;
            startIdleTimer();
        }

        function resetLobby() {
            console.log("Resetting to Lobby...");
            const container = document.getElementById('widget-container');
            container.innerHTML = ''; // Kills the agent session

            document.getElementById('agent-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
            document.getElementById('timeout-msg').style.display = 'none';
            clearTimeout(idleTimer);
            isCallActive = false;
        }

        function startIdleTimer() {
            // If a call is active, we NEVER start the timer.
            if (isCallActive) {
                console.log("Call is active. Idle timer ignored.");
                return;
            }

            clearTimeout(idleTimer);
            document.getElementById('timeout-msg').style.display = 'none';

            console.log("Starting Idle Timer (" + IDLE_TIMEOUT_SECONDS + "s)");
            idleTimer = setTimeout(() => {
                // Double check call state before resetting
                if (!isCallActive) {
                    console.log("Idle timeout reached. Resetting.");
                    resetLobby();
                }
            }, IDLE_TIMEOUT_SECONDS * 1000);
        }

        // Reset timer on interactions (only if NOT in a call)
        document.addEventListener('click', () => {
            if(document.getElementById('agent-screen').style.display === 'block') {
                startIdleTimer();
            }
        });

        document.addEventListener('touchstart', () => {
            if(document.getElementById('agent-screen').style.display === 'block') {
                startIdleTimer();
            }
        });
    </script>
</body>
</html>
